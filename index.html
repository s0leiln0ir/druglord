<style>
/* Layout: one Windows 98 dialog on a teal desktop. Wide screens keep the original three-column window; phones stack the panels. */
:root {
  --desk: #008080; --face: #c0c0c0; --light: #dfdfdf; --white: #ffffff; --shadow: #808080; --dark: #0a0a0a;
  --title: #000080; --title2: #1084d0; --sel: #000080; --ink: #000000; --dim: #808080;
  --good: #008000; --bad: #ff0000; --sys: #ff0080; --tip: #ffffe1;
  --ui: Tahoma, "MS Sans Serif", "Segoe UI", Geneva, Verdana, sans-serif;
  --rich: Arial, Helvetica, sans-serif;
  color-scheme: light;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body { background: var(--desk); color: var(--ink); font: 12px/1.3 var(--ui); margin: 0;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 20px 28px; }
button, input, select { font: inherit; color: inherit; }

/* chrome */
.raised { background: var(--face); box-shadow: inset -1px -1px var(--dark), inset 1px 1px var(--white), inset -2px -2px var(--shadow), inset 2px 2px var(--light); }
.sunken { box-shadow: inset -1px -1px var(--white), inset 1px 1px var(--shadow), inset -2px -2px var(--light), inset 2px 2px var(--dark); }
.win { max-width: 780px; margin: 0 auto; padding: 3px; }
.titlebar { display: flex; align-items: center; gap: 6px; padding: 3px 3px 3px 4px; color: var(--white); font-weight: bold;
  background: linear-gradient(90deg, var(--title), var(--title2)); user-select: none; }
.titlebar .ico { width: 16px; height: 16px; flex: none; }
.titlebar .t { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tb-btn { width: 16px; height: 14px; padding: 0; border: 0; display: grid; place-items: center; font: bold 9px/1 var(--ui); color: var(--ink); }
.body { padding: 6px; display: grid; gap: 6px; }

.group { position: relative; border: 0; margin: 0; padding: 12px 8px 8px; min-width: 0;
  box-shadow: inset -1px -1px var(--white), inset 1px 1px var(--shadow), inset -2px -2px var(--shadow), inset 2px 2px var(--white); }
.group > .legend { position: absolute; top: -7px; left: 7px; padding: 0 3px; background: var(--face); line-height: 14px; }

.btn { min-height: 23px; padding: 3px 8px; border: 0; background: var(--face); cursor: pointer; text-align: center; white-space: nowrap;
  box-shadow: inset -1px -1px var(--dark), inset 1px 1px var(--white), inset -2px -2px var(--shadow), inset 2px 2px var(--light); }
.btn:active:not(:disabled), .btn.down { box-shadow: inset -1px -1px var(--white), inset 1px 1px var(--dark), inset -2px -2px var(--light), inset 2px 2px var(--shadow); padding: 4px 7px 2px 9px; }
.btn:focus-visible { outline: 1px dotted var(--ink); outline-offset: -5px; }
.btn:disabled { color: var(--shadow); text-shadow: 1px 1px var(--white); cursor: default; }
.btn u { text-decoration: underline; }

/* info log */
.log { background: var(--white); height: 128px; overflow-y: auto; padding: 4px 6px; font: 13px/1.35 var(--rich); }
.log p { margin: 0 0 2px; }
.log .good { color: var(--good); } .log .bad { color: var(--bad); } .log .sys { color: var(--sys); font-weight: bold; }

/* list views */
.lv { background: var(--white); overflow: auto; min-height: 0; position: relative; }
.lv table { width: 100%; border-collapse: collapse; table-layout: fixed; font-size: inherit; min-width: var(--minw, 0); }
.lv th { position: sticky; top: 0; z-index: 1; font-weight: normal; text-align: left; padding: 2px 6px; background: var(--face); white-space: nowrap; overflow: hidden;
  box-shadow: inset -1px -1px var(--dark), inset 1px 1px var(--white), inset -2px -2px var(--shadow); }
.lv td { padding: 1px 6px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-variant-numeric: tabular-nums; cursor: default; }
.lv th.n, .lv td.n { text-align: right; }
.lv tr.sel td { background: var(--sel); color: var(--white); }
.lv tr.off td { color: var(--dim); }
.lv tr.sel.off td { color: var(--light); }
.lv .empty { padding: 8px 6px; color: var(--dim); }
.arw { display: inline-block; width: 0; height: 0; margin-right: 5px; vertical-align: 1px; border: 4px solid transparent; }
.arw.up { border-bottom: 6px solid var(--good); border-top: 0; }
.arw.dn { border-top: 6px solid var(--bad); border-bottom: 0; }
.arw.eq { border: 0; width: 8px; height: 2px; background: var(--dim); vertical-align: 3px; }

/* main layout */
.main { display: grid; grid-template-columns: minmax(0,1fr) 112px minmax(0,1fr); grid-template-areas: "info info info" "market mid right"; gap: 6px; }
.a-info { grid-area: info; } .a-market { grid-area: market; } .a-mid { grid-area: mid; } .a-right { grid-area: right; }
.a-market { display: flex; flex-direction: column; }
.a-market .lv { flex: 1; min-height: 300px; }
.a-mid, .play { display: flex; flex-direction: column; gap: 10px; }
.stack { display: flex; flex-direction: column; gap: 4px; }
.a-right { display: grid; grid-template-rows: auto auto; gap: 10px; align-content: start; }
.stock .lv { height: 148px; }
.chk { display: flex; align-items: center; gap: 5px; padding: 2px 0 4px 4px; }

.status { display: grid; gap: 3px; }
.cell { padding: 3px 6px; display: flex; gap: 6px; align-items: center; min-width: 0; }
.cell b { font-weight: normal; color: var(--ink); flex: none; }
.cell span { font-variant-numeric: tabular-nums; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.srow { display: grid; grid-template-columns: 1fr 1.6fr; gap: 3px; }
.money { display: grid; grid-template-columns: minmax(0,1fr) 150px; gap: 4px; }
.tabs, #bGame { display: none; }
.tab { border: 0; background: var(--face); padding: 4px 12px 3px; margin-right: -2px; position: relative; cursor: pointer; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0;
  box-shadow: inset -1px 0 var(--dark), inset 1px 1px var(--white), inset -2px 0 var(--shadow); border-radius: 3px 3px 0 0; top: 2px; }
.tab[aria-selected="true"] { top: 0; padding-bottom: 5px; z-index: 1; font-weight: bold; }
.tab:focus-visible { outline: 1px dotted var(--ink); outline-offset: -4px; }
.money .stack { gap: 3px; }
[hidden] { display: none !important; }
.hist { background: var(--white); display: flex; flex-direction: column; height: 132px; min-width: 0; }
.money { align-items: start; }
.hist .lbl { font-size: 10px; padding: 1px 3px 0; color: var(--title); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; flex: 1; min-width: 0; align-self: center; }
.hist canvas { flex: 1; width: 100%; min-height: 0; display: block; cursor: pointer; }
.htabs { display: flex; align-items: stretch; background: var(--face); box-shadow: inset 0 -1px var(--shadow); }
.htab { border: 0; background: var(--face); font-size: 10px; padding: 1px 6px; cursor: pointer; color: var(--ink); box-shadow: inset -1px 0 var(--shadow); }
.htab[aria-selected="true"] { background: var(--white); font-weight: bold; box-shadow: inset -1px 0 var(--shadow), inset 0 1px var(--white); }
.htab[hidden] { display: none; }
.htab:focus-visible { outline: 1px dotted var(--ink); outline-offset: -2px; }
.wlist { flex: 1; min-height: 0; overflow-y: auto; font-size: 10.5px; padding: 1px 3px; display: grid; grid-template-columns: minmax(0,1fr) auto; align-content: start; column-gap: 6px; grid-auto-rows: 14px; font-variant-numeric: tabular-nums; }
.wlist span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; line-height: 14px; }
.wlist .p { text-align: right; }
.wlist .here { font-weight: bold; color: var(--title); }
.wlist .lo { color: var(--good); } .wlist .hi { color: var(--bad); }
.wlist .none { grid-column: 1 / -1; grid-row: span 3; color: var(--dim); white-space: normal; }

.bar { height: 14px; padding: 2px; background: var(--white); flex: 1; min-width: 0; }
.bar i { display: block; height: 100%; background: repeating-linear-gradient(90deg, var(--title) 0 7px, transparent 7px 9px); }
.bar.low i { background: repeating-linear-gradient(90deg, var(--bad) 0 7px, transparent 7px 9px); }

/* popup menus */
.menu { position: fixed; z-index: 60; min-width: 170px; padding: 2px; max-height: 70vh; overflow-y: auto; }
.menu button { display: block; width: 100%; text-align: left; border: 0; background: none; padding: 4px 20px 4px 22px; cursor: default; white-space: nowrap; }
.menu button:hover:not(:disabled), .menu button:focus-visible { background: var(--sel); color: var(--white); outline: none; }
.menu button:disabled { color: var(--shadow); text-shadow: 1px 1px var(--white); }

/* dialogs */
.veil { position: fixed; inset: 0; z-index: 40; display: grid; place-items: center; padding: 12px; overflow-y: auto; }
.veil.dim { background: rgba(0,0,0,0.08); }
.dlg { width: min(100%, var(--w, 420px)); padding: 3px; }
.dlg .body { padding: 8px; gap: 8px; }
.row { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
.row.end { justify-content: flex-end; }
.row .btn { min-width: 75px; }
.cols { display: grid; gap: 8px; grid-template-columns: minmax(0,1fr) auto minmax(0,1fr); align-items: stretch; }
.cols .mv { display: flex; flex-direction: column; gap: 4px; justify-content: flex-start; padding-top: 4px; }
.msg { background: transparent; padding: 2px; white-space: pre-wrap; }
.field { background: var(--white); border: 0; padding: 3px 4px; min-width: 0; }
.field:focus-visible { outline: 1px dotted var(--ink); }
select.field { padding: 2px; }
.radios { display: flex; flex-wrap: wrap; gap: 4px 14px; }
.radios label, .chk { cursor: pointer; }
.note { color: var(--ink); }
.big { font-size: 13px; }
.flog { background: var(--white); height: 150px; overflow-y: auto; padding: 4px 6px; font: 13px/1.35 var(--rich); }
.flog p { margin: 0 0 2px; } .flog .good { color: var(--good); } .flog .bad { color: var(--bad); }
.docs { background: var(--white); max-height: 60vh; overflow-y: auto; padding: 8px 12px; font: 13px/1.5 var(--rich); }
.docs h3 { margin: 12px 0 2px; font-size: 14px; color: var(--title); } .docs h3:first-child { margin-top: 0; }
.docs p { margin: 0 0 6px; max-width: 65ch; }
.docs table { border-collapse: collapse; font-size: 12px; } .docs td, .docs th { padding: 1px 8px 1px 0; text-align: left; font-variant-numeric: tabular-nums; }
.chart { background: var(--white); height: 260px; } .chart canvas { width: 100%; height: 100%; display: block; }
input[type=range] { width: 100%; accent-color: var(--title); }
.tag { color: var(--dim); }

@media (max-width: 760px) {
  body { padding-block: 6px; height: 100%; }
  .win { height: 100%; display: flex; flex-direction: column; }
  .main { flex: 1; min-height: 0; display: flex; flex-direction: column; gap: 5px; padding: 4px; }
  .a-mid, .a-right, .play .group, .play .stack { display: contents; }
  .group { padding: 9px 6px 6px; }
  .a-info { order: 1; flex: 1 1 0; min-height: 84px; display: flex; flex-direction: column; }
  .a-info .log { flex: 1; height: auto; min-height: 0; }
  .status-g { order: 2; flex: none; }
  .tabs { order: 3; display: flex; flex: none; padding-left: 2px; margin-bottom: -6px; margin-top: 2px; }
  .tab { flex: 1 1 0; }
  .a-market, .stock { order: 4; flex: 2.6 1 0; min-height: 150px; display: flex; flex-direction: column; padding-top: 6px; }
  .main:not([data-tab="stock"]) .stock, .main[data-tab="stock"] .a-market { display: none; }
  .a-market > .legend, .stock > .legend { display: none; }
  .a-market .lv, .stock .lv { flex: 1; min-height: 0; height: auto; }
  .gamegrp { display: none; }
  .play { order: 5; flex: none; display: grid; grid-template-columns: repeat(10, minmax(0,1fr)); gap: 4px; padding-top: 2px; }
  .play .legend { display: none; }
  .play .btn { grid-column: span 2; padding-inline: 2px; min-width: 0; overflow: hidden; text-overflow: ellipsis; }
  #bStay, #bFly { grid-column: span 4; font-weight: bold; }
  #bGame { display: block; grid-column: span 2; }
  .log { font-size: 12.5px; padding: 3px 5px; }
  .status { grid-template-columns: minmax(0,1fr) minmax(0,1fr); grid-template-areas: "loc loc" "day rank" "cash bank" "debt hp" "mini mini"; gap: 3px; }
  .status .srow, .status .money, .status .money > .stack { display: contents; }
  .c-loc { grid-area: loc; } .c-hp { grid-area: hp; } .c-day { grid-area: day; } .c-rank { grid-area: rank; }
  .c-cash { grid-area: cash; } .c-bank { grid-area: bank; } .c-debt { grid-area: debt; } #mini { grid-area: mini; height: 112px; }
  .wlist { grid-template-columns: minmax(0,1fr) auto minmax(0,1fr) auto; font-size: 11px; grid-auto-rows: 12px; column-gap: 5px; }
  .wlist span { line-height: 12px; }
  .hist .lbl { font-size: 11px; }
  .cell { padding: 2px 5px; gap: 4px; }
  .c-hp .bar { height: 12px; }
  .dlg .lv { --minw: 0; }
  .dlg .wide table { --minw: 460px; }
  .cols { grid-template-columns: minmax(0,1fr); }
  .cols .mv { flex-direction: row; padding-top: 0; }
  .cols .mv .btn { flex: 1; }
  .btn { min-height: 32px; }
  .lv td { padding: 4px 6px; }
}
@media (max-width: 760px) and (max-height: 560px) {
  body { height: auto; } .win { height: auto; } .a-market, .stock { min-height: 260px; }
}
@media (prefers-reduced-motion: reduce) { * { scroll-behavior: auto !important; } }

  const ENEMIES = [

    E("a youth gang",15,0,20,25,7,3,20,20,10), E("some street toughs",15,0,20,25,7,2,40,20,20),
    E("ATF",3,1,1,5,15,3,30,75,35), E("a group of concerned citizens",7,1,10,40,5,5,10,35,5),
    E("a group of wild dogs",5,1,0,60,5,5,15,0,0), E("a pack of sewer rats",3,1,0,80,5,10,5,0,0),
    E("the swat team",2,1,1,2,25,4,25,75,45), E("airport security",0,1,1,2,25,20,25,75,35)];
  const AIRPORT = 9;
  const SHIPPERS = [["Quicker Shipper",10,50],["Courier Stan",20,75],["Sharp Ship",50,90],["International Couriers",100,99]].map(([name,rate,rel])=>({name,rate,rel}));
  const SPEEDS = [{name:"Three-day",days:3,f:1},{name:"Two-day",days:2,f:2},{name:"Overnight",days:1,f:4}];
  const HIGH_MSG = ["Prices are higher than the people who use your goods!","Prices go through the roof!","Prices are outrageous!","Prices are insanely high!","Prices are astronomical!"];
  const HIGH_WHY = ["The pilot of a %s shipment fell asleep and crashed. %s","The smuggler of some %s was killed by a rival dealer. %s","Cops burst into a %s warehouse, seizing everything. %s","Racoons broke into a crate of %s, eating some and dying on the rest. %s","Gang warfare is keeping %s off the streets. %s"];
  const LOW_MSG = ["Prices are rock bottom!","Prices drop like lead balloons!","Prices plummet!","Prices nose dive!","Prices are lower than the Marianas Trench!"];
  const LOW_WHY = ["Crates of %s were discovered floating in the ocean. %s","A new %s dealer has arrived in town. %s","A new source of %s is found. %s","A police warehouse is broken into and %s is stolen. %s","A boatload of %s arrives. %s"];
  const LOST_MSG = ["%s lost your shipment from %s!","An employee of %s has stolen your shipment from %s!","%s was raided and your shipment from %s was confiscated!","The pilot from %s went down over the ocean, losing your shipment from %s"];

  /* Difficulty. Level 7 = the original game's exact rules.
     rumors: [% chance of a local rumor, % chance of a rumor about another city, extra rumors per day]
     truth: % of rumors that come true (the rest: 2/3 nothing happens, 1/3 the opposite happens)
     world: World drug prices + History available; arrows: price arrows + normal price range shown
     count/hit/dmg: enemy numbers, accuracy, damage multipliers; run: escape chance multiplier
     deal: points added to surrender, bribe and enemy-flee chances; good/bad: weight of lucky / unlucky events */
  const L = (name,tag,rumors,truth,world,arrows,count,hit,dmg,run,deal,good,bad)=>({name,tag,rumors,truth,world,arrows,count,hit,dmg,run,deal,good,bad});
  const LEVELS = [
    L("Choirboy","Lots of tips, all of them true. Weak enemies, good luck.",[100,100,2],100,true,true,0.5,0.5,0.5,3,30,3,0.3),
    L("Tourist","Plenty of reliable tips. Easy fights.",[100,100,1],95,true,true,0.55,0.6,0.6,2.5,25,2.5,0.4),
    L("Rookie","Two tips a day, almost always right.",[100,100,0],90,true,true,0.65,0.7,0.7,2,20,2,0.5),
    L("Hustler","Frequent, mostly reliable tips.",[80,80,0],85,true,true,0.75,0.8,0.8,1.6,15,1.6,0.65),
    L("Street Smart","Regular tips. Fights a bit softer than the original.",[60,60,0],80,true,true,0.85,0.9,0.9,1.3,10,1.3,0.8),
    L("Pro","Close to the original, with a little more luck.",[45,45,0],75,true,true,0.92,0.95,0.95,1.15,5,1.15,0.9),
    L("Classic","The original Drug Lord 2.2 rules, untouched.",[100/3,100/3,0],70,true,true,1,1,1,1,0,1,1),
    L("Veteran","Fewer, shakier rumors. No price history.",[25,25,0],60,false,true,1.15,1.1,1.1,0.85,-5,0.85,1.15),
    L("Kingpin","Rare rumors you can't trust. Tougher enemies.",[15,15,0],50,false,true,1.3,1.2,1.2,0.7,-10,0.7,1.3),
    L("Blind","No rumors, no price trends, no history. Brutal fights.",[0,0,0],0,false,false,1.5,1.3,1.3,0.6,-15,0.6,1.5)];

  const rnd = n => n > 0 ? Math.floor(Math.random()*n) : n < 0 ? -Math.floor(Math.random()*-n) : 0;
  const idiv = (a,b) => Math.trunc(a/b);
  const fmt = n => (n < 0 ? "-$" : "$") + Math.abs(Math.trunc(n)).toLocaleString("en-US");
  const num = n => Math.trunc(n).toLocaleString("en-US");
  const sp = (s,...a) => { let i=0; return s.replace(/%s|%d/g,()=>String(a[i++])); };
  const cap1 = s => s.replace(/\b\w/g,c=>c.toUpperCase());
  const units = (n,d) => n===1 ? `a unit of ${d}` : `${n} units of ${d}`;
  const normal = (city,drug) => idiv(DRUGS[drug].base*CITIES[city].mult,100);
  const dist = (a,b) => Math.abs(CITIES[a].x - CITIES[b].x);

  function marketStep(market, cap, each) {
    market.forEach((row,ci)=>row.forEach((m,di)=>{
      const N = normal(ci,di), h = idiv(N,2), old = m.p, d = m.t - old;
      m.p = old + rnd(d);
      if (Math.abs(d) < idiv(m.p,10)) m.t = rnd(N) + h;
      m.q = Math.max(0, idiv(cap - idiv((m.p-h)*cap, N) + m.q, 2));
      if (m.e === 0 && rnd(50) === 0) m.e = rnd(2) ? -1 : 1;
      if (m.e === 1) { m.p = (rnd(h)+N)*(rnd(5)+5); m.q = idiv(m.q, rnd(5)+2); }
      else if (m.e === -1) { m.p = idiv(N - rnd(h), rnd(5)+5); m.q = m.q*(rnd(5)+2); }
      each?.(ci, di, m, old);
      m.e = 0; m.r = 0;
    }));
  }

  function newState(level) {
    const s = {v:2, level: level || 7, day:0, maxDays:30, city:0, lastCity:-1, cash:2000, bank:0, health:100, rank:0, rankCount:0,
      rankBonus:[true,false,false,false,false,false], over:false, dead:false, quit:false, score:null,
      market:[], listed:DRUGS.map(()=>false), arrow:DRUGS.map(()=>0),
      inv:DRUGS.map(()=>({q:0,a:0})), vault:CITIES.map(()=>DRUGS.map(()=>({q:0,a:0}))), vaultUsed:false,
      sharks:SHARKS.map(()=>({debt:0,pen:0,el:0})), items:ITEMS.map(()=>({own:0,ammo:0})),
      ships:[], shipSeq:1, log:[], hist:{cash:[],health:[],debt:[],price:CITIES.map(()=>DRUGS.map(()=>[]))}};
    s.sharks[4].debt = 1000;
    const cap = RANKS[0].cap;
    s.market = CITIES.map((c,ci)=>DRUGS.map((d,di)=>{
      const N = normal(ci,di), p = rnd(N)+idiv(N,2);
      return {q:Math.max(0, cap - idiv((p-idiv(N,2))*cap,N)), p, t:p, e:0, r:0};
    }));
    return s;
  }

  class Game {
    constructor(state, ui, level) { this.s = state || newState(level); if (!this.s.level) this.s.level = 7; this.ui = ui; }
    get lv() { return LEVELS[this.s.level - 1]; }
    say(text,color) { this.s.log.push({text,color:color||""}); }
    carried() { return this.s.inv.reduce((t,x)=>t+x.q,0); }
    cap() { return RANKS[this.s.rank].cap; }
    room() { return Math.max(0, this.cap()-this.carried()); }
    debt() { return this.s.sharks.reduce((t,x)=>t+x.debt,0); }
    worth() { return this.s.cash + this.s.bank - this.debt(); }
    blocked() { return this.carried() > this.cap(); }
    price(d) { return this.s.market[this.s.city][d].p; }
    addInv(d,q,paid) { const x=this.s.inv[d]; if (q<=0) return; x.a = x.q+q ? idiv(x.q*x.a + q*paid, x.q+q) : 0; x.q += q; }

    async start() {
      // Ten quiet days of market life before day 1, so every price chart already has a past.
      // The past is simulated on a throwaway copy of the market and played backwards, so it ends on
      // today's opening price. The real market is left exactly as the original game sets it up.
      const s = this.s, PRE = 10, cap = this.cap();
      const copy = s.market.map(row => row.map(m => ({...m})));
      const path = CITIES.map(() => DRUGS.map(() => []));
      for (let k = 0; k < PRE - 1; k++) { marketStep(copy, cap); copy.forEach((row,ci)=>row.forEach((m,di)=>path[ci][di].push(m.p))); }
      s.market.forEach((row,ci)=>row.forEach((m,di)=>s.hist.price[ci][di].push(...path[ci][di].reverse(), m.p)));
      s.hist.pre = PRE; s.log = [];
      await this.nextDay();
    }

    /* ---------- the day ---------- */
    async nextDay() {
      const s = this.s;
      if (s.over) return;
      s.day++; s.vaultUsed = false; s.log = [];
      if (s.lastCity !== s.city) { this.say(sp("Welcome to %s!", CITIES[s.city].name), "sys"); s.lastCity = s.city; }
      if (s.day === s.maxDays) this.say("This is the last day! Better sell all you can!", "sys");
      if (s.day > s.maxDays) return this.endGame();
      if (s.health < 100) s.health = Math.min(100, s.health + 1 + rnd(2));
      s.cash -= RANKS[s.rank].exp;
      if (s.cash <= 0) { this.say("You are out of money! You manage to scrape something together for food and stuff.", "bad"); }
      if (s.day === 1) this.intro();
      else { await this.randomEvent(); if (s.health < 0) return this.endGame(); }
      this.updateMarket();
      await this.updateLoans(); if (s.health < 0) return this.endGame();
      this.checkRank();
      this.updateShipments();
      this.rumors();
      this.record();
      this.ui?.save?.();
    }
    intro() {
      this.say("After one failed job after another, you decide to try a different life: drug dealer! You scrape together your last $1,000, but it really isn't enough to get started. The good news: Buddles spots you another $1,000. The bad news: Buddles is a loan shark, and he will want his money back soon. Time to get to work!");
    }
    record() {
      const s = this.s, h = s.hist;
      h.cash.push(s.cash); h.health.push(s.health); h.debt.push(this.debt());
      s.market.forEach((row,ci)=>row.forEach((m,di)=>h.price[ci][di].push(m.p)));
    }

    updateMarket() {
      const s = this.s;
      marketStep(s.market, this.cap(), (ci, di, m, old) => {
        if (ci === s.city) {
          const nm = DRUGS[di].name;
          if (m.r) this.say(sp("The %s rumor was %s!", nm, m.r === 1 ? "true" : "false"), m.r === 1 ? "good" : "bad");
          if (m.e === 1) this.say(sp(HIGH_WHY[rnd(5)], nm, HIGH_MSG[rnd(5)]));
          else if (m.e === -1) this.say(sp(LOW_WHY[rnd(5)], nm, LOW_MSG[rnd(5)]));
          s.listed[di] = m.e !== 0 || rnd(3) !== 0;
          s.arrow[di] = Math.sign(m.p - old);
        }
      });
    }

    rumors() {
      const s = this.s, lv = this.lv, chance = p => Math.random()*100 < p;
      const one = (city, msgAbundant, msgScarce) => {
        const di = rnd(DRUGS.length), m = s.market[city][di];
        m.r = -1;
        const r = Math.random()*100, miss = 100 - lv.truth;
        if (r < lv.truth) { m.e = 1; m.r = 1; } else if (r - lv.truth < miss*2/3) m.e = 0; else m.e = -1;
        const args = [DRUGS[di].name, CITIES[city].name];
        if (rnd(2) === 0) this.say(sp(msgScarce, ...args), "good");
        else { this.say(sp(msgAbundant, ...args), "good"); m.e = -m.e; }
      };
      const local = () => one(s.city, "You hear a rumor that %s will be abundant tomorrow.", "You hear a rumor that %s will be scarce tomorrow.");
      const away = c => one(c, "You hear a rumor that %s will be abundant in %s tomorrow.", "You hear a rumor that %s will be scarce in %s tomorrow.");
      const other = () => { let c = rnd(CITIES.length-1); if (c >= s.city) c++; away(c); };
      let heard = 0;
      if (chance(lv.rumors[0])) { local(); heard++; }
      if (chance(lv.rumors[1])) { other(); heard++; }
      for (let k = 0; k < lv.rumors[2]; k++) { (rnd(2) ? local : other)(); heard++; }
      // Levels easier than the original always start with a tip on day 1.
      if (s.day === 1 && s.level < 7 && !heard) local();
    }

    checkRank() {
      const s = this.s, total = s.cash + s.bank;
      let target = 0; while (target < 5 && total >= RANKS[target].next) target++;
      if (target === s.rank) { s.rankCount = 0; return; }
      if (++s.rankCount < 3) return;
      s.rankCount = 0;
      if (target > s.rank) {
        s.rank++;
        let extra = "";
        if (!s.rankBonus[s.rank]) { s.rankBonus[s.rank] = true; s.maxDays += 5; extra = " You also get 5 more days of gameplay!"; }
        this.say(sp("You have been PROMOTED to %s.%s", cap1(RANKS[s.rank].name), extra), "good");
        this.say(sp("To keep this rank, you must never let your cash dip below %s for more than 3 days in a row.", fmt(RANKS[target-1].next)), "good");
      } else {
        s.rank--;
        this.say(sp("You have been DEMOTED to %s.", cap1(RANKS[s.rank].name)), "bad");
        if (this.carried() > RANKS[target].cap) this.say(sp("You MUST sell, dump, vault or ship some goods to bring the total to %d units.", this.cap()), "bad");
      }
    }

    /* ---------- loans ---------- */
    async updateLoans() {
      const s = this.s;
      for (let i = 0; i < SHARKS.length; i++) {
        const L = s.sharks[i], S = SHARKS[i];
        if (!L.debt) continue;
        L.debt += idiv(L.debt*S.rate, 100);
        L.pen = idiv(S.rate*L.debt, 200);
        L.el++;
        if (L.el === S.days) this.say(sp("%s is going to be stopping by tomorrow!", S.name), "bad");
        else if (L.el > S.days) {
          const late = L.el - S.days;
          let text = sp("%s and his boys have stopped by!", S.name), dead = false;
          if (late >= 4) {
            s.health -= rnd(25)*(late-3);
            if (s.health < 1) { dead = true; text += " Oh oh, looks like they've killed you!"; }
            else text += " They teach you a lesson!";
          }
          const canPay = !dead && s.cash >= L.debt;
          if (!dead) text += canPay ? " Good thing you have enough cash on hand." : " Looks like you don't have enough money to repay him...";
          const choice = this.ui ? await this.ui.loanVisit({shark:i, name:S.name, text, dead, canPay, debt:L.debt}) : (canPay ? "pay" : "dont");
          if (choice === "pay" && canPay) { this.say(sp("You give %s the %s.", S.name, fmt(L.debt)), "good"); s.cash -= L.debt; L.debt = 0; L.pen = 0; L.el = 0; }
        }
      }
    }
    borrowLimit(i) {
      const s = this.s; let w = s.cash + s.bank;
      s.inv.forEach((x,d)=>{ w += idiv(this.price(d),2)*x.q; });
      return SHARKS[i].mult * Math.min(w, RANKS[s.rank].credit);
    }
    borrow(i, amt) {
      const L = this.s.sharks[i];
      if (L.debt || amt <= 0 || amt > this.borrowLimit(i)) return false;
      L.debt = amt; L.el = 0; L.pen = 0; this.s.cash += amt; return true;
    }
    repayCost(i) { const L = this.s.sharks[i]; return L.el < SHARKS[i].days ? L.debt + L.pen : L.debt; }
    repay(i) {
      const L = this.s.sharks[i], c = this.repayCost(i);
      if (!L.debt || this.s.cash < c) return false;
      this.s.cash -= c; L.debt = 0; L.pen = 0; L.el = 0; return true;
    }
    deposit(a) { a = Math.min(a, this.s.cash); if (a<=0) return false; this.s.cash -= a; this.s.bank += a; return true; }
    withdraw(a) { a = Math.min(a, this.s.bank); if (a<=0) return false; this.s.bank -= a; this.s.cash += a; return true; }

    /* ---------- market actions ---------- */
    maxBuy(d) {
      const s = this.s, m = s.market[s.city][d];
      if (!s.listed[d] || m.p <= 0) return 0;
      return Math.max(0, Math.min(Math.floor(s.cash/m.p), this.room(), m.q));
    }
    buy(d,n) {
      const s = this.s, m = s.market[s.city][d];
      if (n < 1 || n > this.maxBuy(d)) return false;
      s.cash -= n*m.p; m.q -= n; this.addInv(d,n,m.p); return true;
    }
    canSell(d) { return this.s.listed[d] && this.s.inv[d].q > 0; }
    sell(d,n) {
      const s = this.s, m = s.market[s.city][d], x = s.inv[d];
      if (!s.listed[d] || n < 1 || n > x.q) return false;
      s.cash += n*m.p; m.q += n; x.q -= n; if (!x.q) x.a = 0; return true;
    }
    dump(d,n) { const x = this.s.inv[d]; if (n<1 || n>x.q) return false; x.q -= n; if (!x.q) x.a = 0; return true; }

    /* ---------- shop & hospital ---------- */
    healCost(target) { const a = 100-this.s.health, b = 100-target; return a*a*a - b*b*b; }
    heal(target) { const c = this.healCost(target); if (c <= 0 || c > this.s.cash) return false; this.s.cash -= c; this.s.health = target; return true; }
    // Same limits as the original shop, quirks included: armor and No-Scent are never "full",
    // and the amount offered is what you can afford whenever that fits under the cap.
    shopCanItem(i) { const it = ITEMS[i], o = this.s.items[i]; return !!(it.name && it.price) && (o.own < it.maxCarry || it.acc === 0) && this.s.cash >= it.price; }
    shopCanAmmo(i) { const it = ITEMS[i], o = this.s.items[i]; return !!it.ammo && o.ammo < it.maxAmmo && this.s.cash >= it.ammoPrice; }
    shopMaxItem(i) {
      const it = ITEMS[i], o = this.s.items[i]; if (!this.shopCanItem(i)) return 0;
      const n = Math.floor(this.s.cash/it.price); return Math.max(0, n <= it.maxCarry ? n : it.maxCarry - o.own);
    }
    shopMaxAmmo(i) {
      const it = ITEMS[i], o = this.s.items[i]; if (!this.shopCanAmmo(i)) return 0;
      const n = Math.floor(this.s.cash/it.ammoPrice); return Math.max(0, n <= it.maxAmmo ? n : it.maxAmmo - o.ammo);
    }
    buyItem(i,n,ammo) {
      const it = ITEMS[i], o = this.s.items[i];
      if (ammo) { if (n<1 || n>this.shopMaxAmmo(i)) return false; this.s.cash -= n*it.ammoPrice; o.ammo += n; }
      else { if (n<1 || n>this.shopMaxItem(i)) return false; this.s.cash -= n*it.price; o.own += n; }
      return true;
    }
    sellItem(i,n,ammo) {
      const it = ITEMS[i], o = this.s.items[i];
      if (ammo) { if (n<1 || n>o.ammo) return false; this.s.cash += n*it.ammoPrice; o.ammo -= n; }
      else { if (n<1 || n>o.own) return false; this.s.cash += n*it.price; o.own -= n; }
      return true;
    }

    /* ---------- vault ---------- */
    toVault(d,n) { const s=this.s, x=s.inv[d], v=s.vault[s.city][d]; if (n<1||n>x.q) return false; v.a = idiv(v.q*v.a+n*x.a, v.q+n); v.q+=n; x.q-=n; if(!x.q)x.a=0; return true; }
    fromVault(d,n) { const s=this.s, v=s.vault[s.city][d]; if (n<1||n>v.q||n>this.room()) return false; this.addInv(d,n,v.a); v.q-=n; if(!v.q)v.a=0; return true; }

    /* ---------- shipping ---------- */
    shipCost(shipper, speed, unitsN, dest) { return idiv(SHIPPERS[shipper].rate*SPEEDS[speed].f*unitsN*dist(this.s.city,dest), 1000); }
    ship(list, dest, speed, shipper) {
      const s = this.s, n = list.reduce((t,x)=>t+x.q,0), cost = this.shipCost(shipper,speed,n,dest);
      if (!n || dest === s.city || cost <= 0 || cost > s.cash) return false;
      for (const x of list) if (x.q > s.inv[x.d].q) return false;
      s.cash -= cost;
      const drugs = list.filter(x=>x.q>0).map(x=>{ const a = s.inv[x.d].a; s.inv[x.d].q -= x.q; if (!s.inv[x.d].q) s.inv[x.d].a = 0; return {d:x.d,q:x.q,a}; });
      s.ships.push({id:s.shipSeq++, from:s.city, to:dest, shipper, cost, arrive:s.day+SPEEDS[speed].days, status:0, drugs});
      return true;
    }
    updateShipments() {
      const s = this.s;
      s.ships = s.ships.filter(sh => {
        const from = CITIES[sh.from].name;
        if (sh.status === 0 || sh.status === 1) {
          if (rnd(5) === 0) { sh.arrive++; this.say(sp(sh.status ? "Your shipment from %s has been delayed AGAIN!" : "Your shipment from %s has been delayed!", from), "bad"); sh.status = 1; }
          else if (s.day >= sh.arrive) sh.status = 2;
        }
        if (sh.status !== 2) return true;
        if (s.city === sh.to) {
          if (rnd(100)+1 > SHIPPERS[sh.shipper].rel) { this.say(sp(LOST_MSG[rnd(4)], SHIPPERS[sh.shipper].name, from), "bad"); return false; }
          this.say(sp("Your shipment from %s has arrived!", from), "good");
          sh.drugs.forEach(x=>this.addInv(x.d,x.q,x.a));
          if (this.blocked()) this.say(sp("You MUST sell, dump, vault or ship some goods to bring the total to %d units.", this.cap()), "bad");
          return false;
        }
        // The original announces this every day but never actually removes the shipment.
        if (s.day - sh.arrive > 3) this.say(sp("DUDE! You waited too long! Your shipment from %s has been thrown out!", from), "bad");
        return true;
      });
    }

    /* ---------- travel ---------- */
    flightCost(c) { return dist(this.s.city, c); }
    scentNeeded() { return Math.ceil(this.carried()/100); }
    async fly(c, cans) {
      const s = this.s, cost = this.flightCost(c), n = this.carried();
      if (c === s.city || cost > s.cash || this.blocked() || s.over) return false;
      cans = Math.max(0, Math.min(cans|0, s.items[NOSCENT].own));
      s.items[NOSCENT].own -= cans;
      s.cash -= cost;
      s.log = [];
      const safe = n === 0 || rnd(100) === 0 || (rnd(100) !== 0 && 1 + rnd(n) <= cans*100);
      let res = 6;
      if (!safe) {
        this.say("The drug sniffing dogs smell something!", "bad");
        res = await this.encounter(AIRPORT);
      }
      if (res === 0) return this.endGame();
      if (res === 1 || res === 2) { this.say(sp("That didn't work out so well. You are still in %s and it is still day %d.", CITIES[s.city].name, s.day), "bad"); this.ui?.save?.(); return true; }
      s.city = c;
      await this.nextDay();
      return true;
    }

    /* ---------- random events ---------- */
    async randomEvent() {
      if (rnd(2)) return;
      // Fights keep the original share of events at every level; luck only shifts the other events.
      const fights = EVENTS.filter(e=>e.kind==="fight"), rest = EVENTS.filter(e=>e.kind!=="fight");
      const fw = fights.reduce((t,e)=>t+e.w,0), all = EVENTS.reduce((t,e)=>t+e.w,0);
      if (rnd(all) < fw) { const e = fights[rnd(fights.length)]; return e.f.call(this, e); }
      const w = e => e.w * (e.kind === "good" ? this.lv.good : this.lv.bad);
      let r = Math.random() * rest.reduce((t,e)=>t+w(e),0);
      for (const e of rest) { if (r < w(e)) return e.f.call(this, e); r -= w(e); }
    }
    giftDrugs(e) {
      const s = this.s, room = this.room(); if (!room) return;
      const d = rnd(DRUGS.length); let n = rnd(10) === 0 ? rnd(10)+5 : rnd(3)+1; n = Math.min(n, room);
      this.addInv(d, n, 0);
      this.say(sp(e.msg, units(n, DRUGS[d].name)), "good");
    }
    loseSomeDrugs(e) {
      const owned = this.s.inv.map((x,d)=>x.q?d:-1).filter(d=>d>=0); if (!owned.length) return;
      const d = owned[rnd(owned.length)], x = this.s.inv[d], n = rnd(x.q)+1;
      x.q -= n; if (!x.q) x.a = 0;
      this.say(sp(e.msg, n === 1 ? `a unit of ${DRUGS[d].name} is` : `${n} units of ${DRUGS[d].name} are`), "bad");
    }
    findMoney(e) { const a = rnd(10) === 0 ? rnd(5000)+1000 : rnd(500)+100; this.s.cash += a; this.say(sp(e.msg, fmt(a).slice(1)), "good"); }
    loseMoney(e, hurt) {
      const s = this.s; if (s.cash <= 0) return;
      let a = rnd(10) === 0 ? rnd(5000)+1000 : rnd(500)+100; a = Math.min(a, s.cash);
      s.cash -= a;
      if (hurt) s.health -= 5 + rnd(10);
      this.say(sp(e.msg, hurt && s.cash === 0 ? "all your money" : (e.dollar ? fmt(a).slice(1) : fmt(a))), "bad");
    }
    addict(e) {
      const owned = this.s.inv.map((x,d)=>x.q?d:-1).filter(d=>d>=0); if (!owned.length) return;
      const d = owned[rnd(owned.length)]; this.s.inv[d] = {q:0,a:0};
      this.say(sp(e.msg, DRUGS[d].name, DRUGS[d].name), "bad");
    }
    findGear(e) {
      const s = this.s, pickAmmo = list => {
        const tot = list.reduce((t,i)=>t+ITEMS[i].weight,0); let r = rnd(tot);
        for (const i of list) { if (r < ITEMS[i].weight) return i; r -= ITEMS[i].weight; }
      };
      const giveAmmo = i => {
        const it = ITEMS[i], o = s.items[i]; if (o.ammo >= it.maxAmmo) return;
        const n = rnd(it.maxAmmo - o.ammo) + 1; o.ammo += n;
        this.say(sp(e.msg, n === 1 ? `a ${it.ammo}` : `${n} ${it.ammoPl}`), "good");
      };
      if (rnd(5) !== 0) return giveAmmo(pickAmmo(ITEMS.map((it,i)=>it.ammo && it.name ? i : -1).filter(i=>i>=0)));
      const pool = []; ITEMS.forEach((it,i)=>{ if (it.name) pool.push([i,false]); else if (it.ammo) pool.push([i,true]); });
      const tot = pool.reduce((t,[i])=>t+ITEMS[i].weight,0); let r = rnd(tot);
      for (const [i,isAmmo] of pool) {
        if (r < ITEMS[i].weight) {
          if (isAmmo) return giveAmmo(i);
          const it = ITEMS[i], n = it.acc === 0 ? rnd(5)+1 : 1;
          s.items[i].own += n;
          return this.say(sp(e.msg, n === 1 ? `a ${it.name}` : `${n} ${it.plural}`), "good");
        }
        r -= ITEMS[i].weight;
      }
    }
    breakWeapon(e) {
      const s = this.s, maxP = Math.max(...ITEMS.map(it=>it.price));
      const list = ITEMS.map((it,i)=>it.name && it.acc && s.items[i].own ? i : -1).filter(i=>i>=0);
      const w = i => idiv(maxP, ITEMS[i].price), tot = list.reduce((t,i)=>t+w(i),0); if (!tot) return;
      let r = rnd(tot);
      for (const i of list) { if (r < w(i)) { s.items[i].own--; return this.say(sp(e.msg, ITEMS[i].name), "bad"); } r -= w(i); }
    }
    async ambush(e) { this.say(e.msg, "bad"); await this.encounter(null); }

    /* ---------- fights ---------- */
    pickEnemy() {
      const tot = ENEMIES.reduce((t,x)=>t+x.w,0); let r = rnd(tot);
      for (let i=0;i<ENEMIES.length;i++) { if (r < ENEMIES[i].w) return i; r -= ENEMIES[i].w; }
      return 0;
    }
    async encounter(ei) {
      const f = new Fight(this, ei == null ? this.pickEnemy() : ei, ei === AIRPORT);
      const res = this.ui ? await this.ui.fight(f) : autoFight(f);
      return res;
    }

    /* ---------- the end ---------- */
    endGame() {
      const s = this.s; if (s.over) return;
      s.over = true; s.day = Math.min(s.day, s.maxDays);
      if (s.health < 0) { s.dead = true; this.say("YOU WERE KILLED!", "bad"); }
      s.score = this.worth();
      this.say(sp("That's it, the game is over! You have a final score of %s", fmt(s.score)), "sys");
      this.ui?.gameOver?.();
      this.ui?.save?.();
    }
    quit() { if (!this.s.over) { this.s.log = []; this.s.quit = true; this.endGame(); } }
  }

  const EVENTS = [
    {kind:"good", w:5, msg:"A friend stops by and gives you %s!", f:Game.prototype.giftDrugs},
    {kind:"bad", w:2, msg:"You feel someone brush against you and discover that %s missing!", f:Game.prototype.loseSomeDrugs},
    {kind:"bad", w:1, msg:"Close inspection reveals that %s fake!", f:Game.prototype.loseSomeDrugs},
    {kind:"good", w:5, msg:"You stumble across a dead body and find %s!", f:Game.prototype.giftDrugs},
    {kind:"good", w:3, msg:"You find a woman's purse in a trash can. Inside is $%s!", f:Game.prototype.findMoney},
    {kind:"good", w:3, msg:"You find a wallet with $%s in it!", f:Game.prototype.findMoney},
    {kind:"bad", w:1, msg:"Your home is infested with rats! You have to pay an exterminator $%s to get rid of them!", dollar:true, f(e){ return this.loseMoney(e,false); }},
    {kind:"bad", w:3, msg:"You have been mugged! He takes %s and runs!", f(e){ return this.loseMoney(e,true); }},
    {kind:"bad", w:3, msg:"You get off the subway and find $%s has been lifted from you!", dollar:true, f(e){ return this.loseMoney(e,false); }},
    {kind:"bad", w:1, msg:"A %s addict jumps you and demands all your %s! You have no choice but to hand it over.", f:Game.prototype.addict},
    {kind:"good", w:5, msg:"You trip over a body. You search it and find %s!", f:Game.prototype.findGear},
    {kind:"bad", w:1, msg:"OH MAN! You are cleaning your %s and it falls apart!", f:Game.prototype.breakWeapon},
    {kind:"fight", w:10, msg:"Some days just aren't worth it...", f:Game.prototype.ambush},
    {kind:"fight", w:10, msg:"Did you hear that?", f:Game.prototype.ambush},
    {kind:"fight", w:10, msg:"In the distance you catch sight of something. You try to run, but it's of no use.", f:Game.prototype.ambush}];

  class Fight {
    constructor(g, ei, airport) {
      this.g = g; this.s = g.s; this.ei = ei; this.e = ENEMIES[ei]; this.airport = airport;
      const lv = g.lv; this.lv = lv;
      let n = this.e.count; if (this.e.money) n *= this.s.rank + 1;
      n = Math.max(1, Math.round(n * lv.count));
      this.total = this.left = Math.max(1, rnd(n) + idiv(n,2));
      this.perHead = rnd(500) + 500;
      this.surrenderOk = this.e.surr > 0; this.result = null; this.lines = [];
      this.say(sp("You have encountered %s! There %s of them!", this.e.name, this.left === 1 ? "is only one" : `are ${this.left}`), "bad");
    }
    say(text,color) { this.lines.push({text,color:color||""}); }
    get canBribe() { return this.e.bribe > 0 && this.result == null; }
    get canSurrender() { return this.surrenderOk && this.result == null; }
    weapons() {
      const s = this.s;
      return ITEMS.map((it,i)=>{
        const o = s.items[i]; if (it.armor || !it.acc) return null;
        if (it.name && o.own && (!it.ammo || o.ammo > 0)) return {i, name:it.name, ammo: it.ammo ? o.ammo : null};
        if (!it.name && o.ammo > 0) return {i, name:it.ammo, ammo:o.ammo};
        return null;
      }).filter(Boolean);
    }
    end(code) { this.result = code; if (code === 4 || code === 5) this.loot(); }
    loot() {
      const m = this.e.money; if (!m) return;
      let k = this.total - this.left, cash = 0;
      while (k-- > 0) cash += rnd(5) === 0 ? idiv(m,2) + rnd(m) : idiv(10*m,2) + rnd(10*m);
      if (cash > 0) { this.s.cash += cash; this.say(sp("You search the bodies and find %s!", fmt(cash)), "good"); }
    }
    attacked() {
      const s = this.s; if (this.left <= 0) return;
      let armor = 0;
      ITEMS.forEach((it,i)=>{ if (it.armor && s.items[i].own) armor += idiv(it.armor,2) + rnd(it.armor); });
      let dmg = 0;
      const hit = this.e.hit * this.lv.hit, maxDmg = Math.max(1, Math.round(this.e.dmg * this.lv.dmg));
      for (let k=0;k<this.left;k++) if (rnd(101)+1 < hit) dmg += rnd(maxDmg);
      dmg -= armor;
      if (dmg < 1) return this.say("They attack you but miss!");
      s.health -= dmg;
      this.say(sp("You have been hit for %s of damage!", dmg === 1 ? "1 point" : `${dmg} points`), "bad");
      if (s.health < 1) { this.say("YOU ARE DEAD!", "bad"); this.end(0); }
    }
    surrender() {
      const s = this.s; this.say("You shout out that you surrender.");
      if (rnd(101)+1 < this.e.surr + this.lv.deal) {
        const had = this.g.carried();
        s.inv.forEach(x=>{x.q=0;x.a=0;});
        if (!this.e.arrest) { this.attacked(); s.cash = 0; this.say("They accept your surrender but take everything! Hope you have money in the bank!", "bad"); }
        else { this.say("They accept your surrender."); this.say(had ? "They seize all your drugs! They arrest you and after a few hours in jail, you are let go." : "They search you and find you are clean! A brief apology is mumbled.", had ? "bad" : "good"); }
        return this.end(1);
      }
      this.say("Your surrender is not accepted!", "bad"); this.surrenderOk = false; this.attacked();
    }
    run() {
      const s = this.s; this.say("You try to run!");
      if (Math.random() < Math.min(0.95, this.lv.run / Math.min(this.left+1, 10))) {
        this.say("You manage to lose them in the streets!", "good");
        if (this.airport) {
          if (s.cash > 50) s.cash = 50;
          s.inv.forEach(x=>{x.q=0;x.a=0;});
          this.say(sp("BUT, all of your money and drugs have been lost because they were in your luggage. All you have left is %s, which was in your wallet.", fmt(s.cash)), "bad");
        }
        return this.end(2);
      }
      this.say("You are unable to shake them.", "bad"); this.attacked();
    }
    bribe(amount) {
      const s = this.s;
      if (amount == null) { this.say("Probably not the best time to be stingy.", "bad"); return this.attacked(); }
      amount = Math.min(amount|0, s.cash);
      if (amount >= this.left*this.perHead && rnd(101) <= this.e.bribe + this.lv.deal) { s.cash -= amount; this.say("They accept your bribe!", "good"); return this.end(3); }
      this.say("They laugh at your attempt!", "bad"); this.attacked();
    }
    fight(i) {
      const it = ITEMS[i], o = this.s.items[i];
      if (it.ammo) { if (o.ammo <= 0) return; o.ammo--; }
      this.say(sp("You use your %s.", it.name || it.ammo));
      if (it.acc <= rnd(101)+1) { this.say("You miss!"); return this.attacked(); }
      let k = it.dmg === 1 ? 1 : rnd(it.dmg) + idiv(it.dmg,2); k = Math.max(1, Math.min(k, this.left));
      this.left -= k;
      if (!this.left) { this.say(sp("You killed the remaining %d! They are all dead!", k), "good"); return this.end(4); }
      this.say(sp("You killed %d of them! Only %s.", k, this.left === 1 ? "1 remains" : `${this.left} remain`), "good");
      if (this.left < idiv(this.total,2) && rnd(100) < this.e.flee + this.lv.deal) { this.say("They decide to flee!", "good"); return this.end(5); }
      this.attacked();
    }
  }
  function autoFight(f) {
    for (let guard=0; f.result == null && guard<500; guard++) {
      const w = f.weapons(); w.sort((a,b)=>ITEMS[b.i].dmg-ITEMS[a.i].dmg);
      if (w.length) f.fight(w[0].i); else if (f.canSurrender) f.surrender(); else f.run();
    }
    f.lines.forEach(l=>f.g.say(l.text,l.color));
    return f.result ?? 2;
  }

  return {LEVELS,DRUGS,CITIES,RANKS,SHARKS,ITEMS,NOSCENT,ENEMIES,SHIPPERS,SPEEDS,AIRPORT,Game,Fight,newState,fmt,num,sp,cap1,idiv,normal,dist,rnd};
})();
if (typeof module !== "undefined") module.exports = DL;

</script>
<script>
(() => {

let game = null, busy = false, sel = {market:-1, stock:-1}, miniIdx = 0, miniDrug = -1, miniManual = false, tab = "market";

/* ---------- list view ---------- */

/* ---------- dialogs ---------- */

/* ---------- fight ---------- */
function fightDialog(f) {

    box.dataset.esc = "off";
    const log = h("div", {class: "flog sunken", "aria-live": "polite"});
    const left = h("span", {}), bar = h("div", {class: "bar sunken", style: "height:18px"}, h("i"));
    const wl = h("div", {class: "lv sunken", style: "height:104px"});
    let wsel = -1;

    const bR = btn("Run", () => act(() => f.run()));

/* ---------- history drawing ---------- */
function series(kind, city, drug) {
  const s = game.s;
  if (kind === "cash") return {name: "Your Cash", data: s.hist.cash, money: true};
  if (kind === "health") return {name: "Your Health", data: s.hist.health, min: 0, max: 100};
  if (kind === "debt") return {name: "Your Debt", data: s.hist.debt, money: true};
  const N = normal(city, drug);
  return {name: `${DRUGS[drug].name} in ${CITIES[city].name}`, data: s.hist.price[city][drug], money: true, range: [idiv(N,2), N + idiv(N,2)], offset: s.hist.pre || 0};
}
function drawChart(cv, ser, opt={}) {
  const dpr = devicePixelRatio || 1, w = cv.clientWidth, ht = cv.clientHeight;
  if (!w || !ht) return;
  cv.width = w*dpr; cv.height = ht*dpr;
  const c = cv.getContext("2d"); c.scale(dpr, dpr); c.clearRect(0,0,w,ht);
  const d = ser.data; if (!d.length) return;
  const pad = opt.axes ? {l: 70, r: 28, t: 10, b: 22} : {l: 3, r: 3, t: 3, b: 3};
  let lo = ser.min ?? Math.min(...d, ...(ser.range || [])), hi = ser.max ?? Math.max(...d, ...(ser.range || []));
  if (hi === lo) { hi += 1; lo -= 1; }
  const X = i => pad.l + (d.length < 2 ? (w - pad.l - pad.r)/2 : i*(w - pad.l - pad.r)/(d.length - 1));
  const Y = v => pad.t + (hi - v)*(ht - pad.t - pad.b)/(hi - lo);
  const line = (y, dash) => { c.save(); c.strokeStyle = "#808080"; c.setLineDash(dash || []); c.beginPath(); c.moveTo(pad.l, Y(y)); c.lineTo(w - pad.r, Y(y)); c.stroke(); c.restore(); };
  if (opt.axes) {
    c.font = "11px Tahoma, sans-serif"; c.fillStyle = "#000"; c.textAlign = "right"; c.textBaseline = "middle";
    [hi, (hi+lo)/2, lo].forEach(v => { c.fillText(ser.money ? fmt(v) : Math.round(v), pad.l - 6, Y(v)); c.strokeStyle = "#e4e4e4"; c.beginPath(); c.moveTo(pad.l, Y(v)); c.lineTo(w - pad.r, Y(v)); c.stroke(); });
    c.textAlign = "center"; c.textBaseline = "top";
    const step = Math.max(1, Math.ceil(d.length/10));
    for (let i = 0; i < d.length; i += step) c.fillText("Day " + (i+1-(ser.offset||0)), X(i), ht - pad.b + 6);
  }
  if (ser.range) { line(ser.range[0]); line(ser.range[1]); line(d.reduce((a,b)=>a+b,0)/d.length, [3,3]); }
  if (ser.offset && d.length > ser.offset) { c.save(); c.strokeStyle = "#c0c0c0"; c.setLineDash([2,2]); c.beginPath(); c.moveTo(X(ser.offset), pad.t); c.lineTo(X(ser.offset), ht - pad.b); c.stroke(); c.restore(); }
  c.strokeStyle = "#000080"; c.lineWidth = opt.axes ? 2 : 1.5; c.beginPath();
  d.forEach((v,i) => i ? c.lineTo(X(i), Y(v)) : c.moveTo(X(i), Y(v))); c.stroke();
  c.fillStyle = "#000080"; c.beginPath(); c.arc(X(d.length-1), Y(d[d.length-1]), opt.axes ? 3.5 : 2, 0, 7); c.fill();
}
function miniList() { const s = game.s; return [["cash"],["health"],["debt"], ...(game.lv.world ? DRUGS.map((d,i)=>["drug", s.city, i]) : [])]; }
let miniTab = "chart";
function drawWorld() {
  const box = $("miniW"), s = game.s, d = miniDrug >= 0 ? miniDrug : (sel.market >= 0 ? sel.market : sel.stock);

function drawMini() {

/* ---------- actions ---------- */
async function run(fn) { if (busy) return; busy = true; render(); try { await fn(); } finally { busy = false; ui.save(); render(); } }

function doBuy() {
  const g = game, d = sel.market; if (!g || g.s.over || d < 0) return;

/* ---------- opening riff: an original doom riff in drop C, played with Web Audio ---------- */
const Music = (() => {
  let ctx = null, bus = null;
  const hz = m => 440 * Math.pow(2, (m - 69) / 12);
  function curve(k) { const n = 2048, c = new Float32Array(n); for (let i = 0; i < n; i++) { const x = i*2/n - 1; c[i] = (1 + k) * x / (1 + k * Math.abs(x)); } return c; }
  let noiseBuf = null;
  function noise() { if (noiseBuf) return noiseBuf; noiseBuf = ctx.createBuffer(1, ctx.sampleRate*2, ctx.sampleRate); const d = noiseBuf.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random()*2 - 1; return noiseBuf; }
  function env(g, t, peak, a, hold, rel) { g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(peak, t + a); g.gain.setValueAtTime(peak, t + a + hold); g.gain.exponentialRampToValueAtTime(0.0001, t + a + hold + rel); }
  function guitarChain(pan) {
    const pre = ctx.createGain(); pre.gain.value = 3.2;
    const ws = ctx.createWaveShaper(); ws.curve = curve(90); ws.oversample = "4x";
    const hp = ctx.createBiquadFilter(); hp.type = "highpass"; hp.frequency.value = 70;
    const mid = ctx.createBiquadFilter(); mid.type = "peaking"; mid.frequency.value = 650; mid.Q.value = 0.8; mid.gain.value = -5;
    const lp = ctx.createBiquadFilter(); lp.type = "lowpass"; lp.frequency.value = 3600; lp.Q.value = 0.9;
    const cab = ctx.createBiquadFilter(); cab.type = "peaking"; cab.frequency.value = 110; cab.gain.value = 5;
    const out = ctx.createGain(); out.gain.value = 0.16;
    const p = ctx.createStereoPanner(); p.pan.value = pan;
    pre.connect(ws); ws.connect(hp); hp.connect(cab); cab.connect(mid); mid.connect(lp); lp.connect(out); out.connect(p); p.connect(bus);
    return pre;
  }
  let gL, gR, bass;
  function chord(t, root, dur, opt = {}) {
    const ivs = opt.single ? [0] : [0, 7, 12];
    [[gL, -7], [gR, 7]].forEach(([dest, cents]) => ivs.forEach(iv => {
      const o = ctx.createOscillator(), g = ctx.createGain();
      o.type = "sawtooth"; o.frequency.setValueAtTime(hz(root + iv), t); o.detune.value = cents + (iv ? 3 : 0);
      if (opt.bendTo != null) o.frequency.exponentialRampToValueAtTime(hz(opt.bendTo + iv), t + dur*0.9);
      if (opt.vib) { const l = ctx.createOscillator(), lg = ctx.createGain(); l.frequency.value = 5.5; lg.gain.value = 14; l.connect(lg); lg.connect(o.detune); l.start(t + dur*0.35); l.stop(t + dur + 0.3); }
      env(g, t, opt.mute ? 0.45 : 0.9, 0.004, Math.max(0.01, dur - (opt.mute ? 0.09 : 0.05)), opt.mute ? 0.05 : 0.12);
      o.connect(g); g.connect(dest); o.start(t); o.stop(t + dur + 0.25);
    }));
    const b = ctx.createOscillator(), bg = ctx.createGain();
    b.type = "square"; b.frequency.setValueAtTime(hz(root - 12), t);
    if (opt.bendTo != null) b.frequency.exponentialRampToValueAtTime(hz(opt.bendTo - 12), t + dur*0.9);
    env(bg, t, opt.mute ? 0.18 : 0.26, 0.006, Math.max(0.01, dur - 0.06), 0.1);
    b.connect(bg); bg.connect(bass); b.start(t); b.stop(t + dur + 0.2);
  }
  function kick(t) {
    const o = ctx.createOscillator(), g = ctx.createGain();
    o.frequency.setValueAtTime(140, t); o.frequency.exponentialRampToValueAtTime(38, t + 0.14);
    env(g, t, 1.1, 0.002, 0.04, 0.32); o.connect(g); g.connect(bus); o.start(t); o.stop(t + 0.45);
  }
  function snare(t) {
    const n = ctx.createBufferSource(); n.buffer = noise();
    const f = ctx.createBiquadFilter(); f.type = "bandpass"; f.frequency.value = 1900; f.Q.value = 0.7;
    const g = ctx.createGain(); env(g, t, 0.55, 0.002, 0.03, 0.26);
    n.connect(f); f.connect(g); g.connect(bus); n.start(t, Math.random()); n.stop(t + 0.4);
    const o = ctx.createOscillator(), og = ctx.createGain(); o.type = "triangle"; o.frequency.setValueAtTime(190, t); o.frequency.exponentialRampToValueAtTime(140, t + 0.1);
    env(og, t, 0.35, 0.002, 0.02, 0.12); o.connect(og); og.connect(bus); o.start(t); o.stop(t + 0.2);
  }
  function cymbal(t, len, peak) {
    const n = ctx.createBufferSource(); n.buffer = noise();
    const f = ctx.createBiquadFilter(); f.type = "highpass"; f.frequency.value = 5200;
    const g = ctx.createGain(); env(g, t, peak, 0.003, 0.02, len);
    n.connect(f); f.connect(g); g.connect(bus); n.start(t, Math.random()); n.stop(t + len + 0.1);
  }
  // C2 = 36. Drop-C doom: slow, heavy, with a tritone (F#) and a half-step grind (C# against C).
  const C = 36;
  function score() {
    const ev = [];
    const add = (beat, root, dur, opt) => ev.push({beat, root, dur, opt: opt || {}});
    // intro: one huge ringing chord, then a slow bend down into the riff
    add(0, C, 5.5, {vib: true}); add(6, C + 3, 2, {bendTo: C + 2});
    const riff = (b, last) => {
      add(b + 0,    C,     1.5);
      add(b + 1.5,  C,     0.5, {mute: true});
      add(b + 2,    C + 1, 1);              // the grind: C# against the open C
      add(b + 3,    C,     0.5, {mute: true}); add(b + 3.5, C, 0.5, {mute: true});
      add(b + 4,    C + 6, 1.5, {vib: true}); // tritone
      add(b + 5.5,  C + 5, 0.5);
      add(b + 6,    C + 3, 1);
      if (!last) { add(b + 7, C + 2, 0.5); add(b + 7.5, C + 1, 0.5); }
      else add(b + 7, C + 3, 1, {bendTo: C + 1});
    };
    const chug = b => { for (let i = 0; i < 6; i++) add(b + i*0.25, C, 0.25, {mute: true}); add(b + 1.5, C + 10, 0.5); add(b + 2, C + 8, 2, {vib: true}); };
    riff(8); riff(16); chug(24); add(28, C + 6, 2, {vib: true}); add(30, C + 5, 1); add(31, C + 3, 1, {bendTo: C + 1});
    riff(32); riff(40, true);
    add(48, C, 6, {vib: true});
    return ev;
  }
  function drums(t0, beat) {
    const at = b => t0 + b*beat;
    cymbal(at(0), 3.5, 0.32); kick(at(0));
    kick(at(6)); kick(at(7)); snare(at(7.5));
    for (const b of [8, 16, 32, 40]) {
      cymbal(at(b), 2.2, 0.22);
      kick(at(b)); kick(at(b + 1.5)); snare(at(b + 2)); kick(at(b + 3)); kick(at(b + 3.5));
      kick(at(b + 4)); snare(at(b + 6)); kick(at(b + 7)); if (b !== 40) { snare(at(b + 7.5)); }
      for (let i = 0; i < 8; i++) cymbal(at(b + i), 0.12, 0.05);
    }
    for (let i = 0; i < 6; i++) kick(at(24 + i*0.25));
    cymbal(at(26), 2, 0.22); snare(at(26)); kick(at(28)); snare(at(30)); kick(at(31)); snare(at(31.5)); snare(at(31.75));
    cymbal(at(48), 5, 0.38); kick(at(48)); snare(at(48));
  }
  function play() {
    try {
      stop();
      ctx = ctx || new (window.AudioContext || window.webkitAudioContext)();
      if (ctx.state === "suspended") ctx.resume().catch(() => {});
      bus = ctx.createGain(); bus.gain.value = 0.55;
      const comp = ctx.createDynamicsCompressor(); comp.threshold.value = -14; comp.ratio.value = 4;
      const master = ctx.createGain(); master.gain.value = 0.75;
      bus.connect(comp); comp.connect(master); master.connect(ctx.destination);
      bus._master = master;
      gL = guitarChain(-0.55); gR = guitarChain(0.55);
      bass = ctx.createGain(); bass.gain.value = 0.5;
      const bl = ctx.createBiquadFilter(); bl.type = "lowpass"; bl.frequency.value = 420; bass.connect(bl); bl.connect(bus);
      const beat = 60 / 66, t0 = ctx.currentTime + 0.12;
      score().forEach(e => chord(t0 + e.beat*beat, e.root, e.dur*beat, e.opt));
      drums(t0, beat);
      master.gain.setValueAtTime(0.75, t0 + 52*beat); master.gain.linearRampToValueAtTime(0.0001, t0 + 55*beat);
    } catch {}
  }
  function stop() {
    if (!ctx || !bus) return;
    const m = bus._master, t = ctx.currentTime;
    try { m.gain.cancelScheduledValues(t); m.gain.setValueAtTime(m.gain.value, t); m.gain.linearRampToValueAtTime(0.0001, t + 0.4); const old = m; setTimeout(() => old.disconnect(), 600); } catch {}
    bus = null;
  }
  return {play, stop};
})();

const soundOn = () => store.get("druglord.sound") !== false;
$("snd").checked = soundOn();
$("snd").onchange = e => { store.set("druglord.sound", e.target.checked); if (!e.target.checked) Music.stop(); };

/* ---------- the opening warning ---------- */
function splash() {
  return dialog("Drug Lord", 470, (b, close, box) => {
    box.dataset.esc = "off";
    const paintWarn = () => {
      b.replaceChildren(
        h("div", {class: "docs sunken", style: "max-height:none"},
          h("p", {style: "text-align:center;font-size:22px;font-weight:bold;color:var(--title);margin:4px 0 2px;letter-spacing:1px"}, "DRUG LORD"),
          h("p", {style: "text-align:center;margin-bottom:12px", class: "tag"}, "version 2.2, rebuilt for the browser"),
          h("h3", {style: "color:var(--bad)"}, "WARNING!"),
          h("p", {}, "Some people will find this game offensive. You play a drug dealer: you buy and sell drugs, and sometimes you kill whoever gets in your way. If that's not for you, click Don't Play now."),
          h("h3", {style: "color:var(--bad)"}, "AN EVEN MORE IMPORTANT WARNING!"),
          h("p", {style: "font-weight:bold"}, "Don't sell drugs. Don't buy drugs. And never, ever use drugs.")),
        h("div", {class: "row end"},
          btn("Play", () => { if (soundOn()) Music.play(); close(true); }, {focus: true}),
          btn("Don't Play", paintBye)));
      setTimeout(() => b.querySelector(".btn")?.focus(), 0);
    };
    const paintBye = () => {
      b.replaceChildren(h("div", {class: "msg big"}, "Fair enough. The game will be here if you change your mind."),
        h("div", {class: "row end"}, btn("Back", paintWarn, {focus: true})));
      setTimeout(() => b.querySelector(".btn")?.focus(), 0);
    };
    paintWarn();
  });
}

function start(data) {
  const saved = (data && data.save && JSON.parse(data.save)) || store.get(SAVE);
  if (saved && saved.v === 2 && saved.market) game = new Game(saved, ui);
  render();
  if (!data || !data.save) splash();
}
window.claude?.hot?.snapshot?.(() => ({save: game ? JSON.stringify(game.s) : null}));
window.claude?.hot?.ready ? window.claude.hot.ready(start) : start(window.claude?.hot?.data ?? {});
})();
</script>

if ("serviceWorker" in navigator) addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(() => {}));
</script>
